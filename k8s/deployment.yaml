apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-banking
  labels:
    app: digital-banking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-banking
  template:
    metadata:
      labels:
        app: digital-banking
    spec:
      containers:
        - name: digital-banking
          image: PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: digital-banking
  labels:
    app: digital-banking
spec:
  selector:
    app: digital-banking
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer
