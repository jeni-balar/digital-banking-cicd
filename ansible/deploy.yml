---
- name: Deploy digital banking application to EKS
  hosts: jenkins
  gather_facts: false
  vars:
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('ap-south-1', true) }}"
    image_tag: "{{ image_tag | default('latest') }}"
    ecr_repo: "{{ lookup('env', 'ECR_REPO') | default('digital-banking', true) }}"
    aws_account_id: "{{ lookup('pipe', 'aws sts get-caller-identity --query Account --output text') | trim }}"
    image_uri: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ ecr_repo }}:{{ image_tag }}"
    cluster_name: "{{ lookup('env', 'EKS_CLUSTER') | default('digital-banking-eks', true) }}"
    namespace_map:
      dev: banking-dev
      staging: banking-staging
      prod: banking-prod
    namespace: "{{ namespace_map[env_name] }}"

  tasks:
    - name: Update kubeconfig
      ansible.builtin.command:
        cmd: "aws eks update-kubeconfig --region {{ aws_region }} --name {{ cluster_name }}"
      changed_when: true

    - name: Ensure namespace exists
      ansible.builtin.command:
        cmd: "kubectl create namespace {{ namespace }}"
      register: ns_result
      failed_when: ns_result.rc != 0 and 'AlreadyExists' not in ns_result.stderr
      changed_when: "'created' in ns_result.stdout"

    - name: Apply deployment manifest
      ansible.builtin.command:
        cmd: "kubectl apply -f k8s/deployment.yaml -n {{ namespace }}"
      changed_when: true

    - name: Set immutable image tag
      ansible.builtin.command:
        cmd: "kubectl -n {{ namespace }} set image deployment/digital-banking digital-banking={{ image_uri }}"
      changed_when: true

    - name: Wait for rollout
      ansible.builtin.command:
        cmd: "kubectl -n {{ namespace }} rollout status deployment/digital-banking --timeout=180s"
      changed_when: false
